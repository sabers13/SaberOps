[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saberops"
version = "0.4.0"
description = "Plan-aware execution engine that turns AI coding subscriptions into verified commits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "websockets",
    "pyte>=0.8.2,<0.9",
]

[project.scripts]
orch = "saberops.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.2",
    "pytest-timeout>=2.3",
    "coverage>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saberops = [
    "templates/*.html",
    "static/css/*.css",
    "static/fonts/*.ttf",
    "static/fonts/*-OFL.txt",
    "static/js/*.js",
    "static/vendor/xterm/*",
    "static/vendor/chat/*",
    "defaults/*.json",
    "defaults/*.mjs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 180
addopts = "--strict-markers"
markers = [
    "serial: timing or process-control sensitive; run without xdist",
    "slow: deliberately long-running test",
]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
