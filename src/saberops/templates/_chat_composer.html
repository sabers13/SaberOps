<div class="composer-wrap">
  <form class="composer" method="post" action="/chats/{{ chat.id }}/messages" data-chat-form>
    <input type="hidden" name="max_parallel_workers" value="{{ chat.max_parallel_workers|default(3) }}">
    <input type="hidden" name="execution_mode" value="{{ chat.execution_mode|default('single') }}">
    <input type="hidden" name="mode" value="chat" data-chat-mode-input>
    <label class="sr-only" for="chatMessage">Message the orchestrator</label>
    <textarea id="chatMessage" name="message" placeholder="Ask anything, or think through an idea…" rows="1" maxlength="32000" required></textarea>
    <div class="composer-bar"><div class="composer-context"><span id="chatRecipient" class="muted">To orchestrator</span><span id="chatPermissionHint" class="muted">Discussion only</span><label data-work-only class="work-mode-picker"><span class="sr-only">Work execution</span><select id="workExecutionMode" aria-label="Work execution"><option value="single">Single worker</option><option value="parallel"{% if chat.execution_mode|default('single') == 'parallel' %} selected{% endif %}>Parallel team</option></select></label></div><div class="composer-actions"><button type="button" class="text-button" id="chatPromote"{% if chat.kind|default('legacy') != 'chat' %} data-work-only{% endif %} title="Edit a brief before sending it to your configured workers">{{ 'Turn into work' if chat.kind|default('legacy') == 'chat' else 'Review brief' }}</button><button type="button" class="send-button chat-stop" id="chatStop" aria-label="Stop reply" title="Stop reply" hidden>■</button><button type="submit" class="send-button" id="chatSend" aria-label="Send message" title="Send message"{% if chat.busy %} disabled{% endif %}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div>
  </form>
  <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
</div>
