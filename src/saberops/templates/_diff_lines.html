{% if file.lines %}<div class="diff-code" role="region" aria-label="Diff for {{ file.path }}" tabindex="0"><table class="diff-lines"><tbody>{% for line in file.lines %}<tr class="diff-line diff-{{ line.kind }}"><td class="diff-number">{{ line.old if line.old is not none else '' }}</td><td class="diff-number">{{ line.new if line.new is not none else '' }}</td><td class="diff-source"><code>{{ line.text }}</code></td></tr>{% endfor %}</tbody></table></div>{% endif %}
